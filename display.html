<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>푸드트럭 호출 디스플레이</title>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="transport-cloud.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;background:#0a0a14;color:#fff;font-family:'맑은 고딕','Malgun Gothic',sans-serif;overflow:hidden;}
header,footer,main,.panel{overflow-x:hidden;max-width:100%;}
body{display:flex;flex-direction:column;}
header{background:linear-gradient(90deg,#d08010,#e09020);padding:20px 40px;display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid #ffb84d;gap:14px;min-width:0;}
header h1{font-size:42px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1;}
header .clock{font-size:32px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;flex-shrink:0;}
main{flex:1;display:grid;grid-template-columns:2fr 1fr;gap:0;min-height:0;}
.panel{padding:30px 40px;display:flex;flex-direction:column;min-height:0;overflow:hidden;}
.panel.ready{background:#0a1f0a;border-right:2px solid #1a3a1a;}
.panel.cooking{background:#0a1228;}
.panel h2{font-size:clamp(20px,2.4vw,36px);font-weight:900;margin-bottom:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2;}
.panel h2 .count{display:inline-block;font-size:0.65em;background:rgba(255,255,255,.1);padding:2px 12px;border-radius:14px;margin-left:8px;vertical-align:middle;}
.panel.ready h2{color:#7fff7f;}
.panel.cooking h2{color:#7fc8ff;}
.count{font-size:22px;background:rgba(255,255,255,.1);padding:4px 14px;border-radius:20px;}
.grid-ready{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:16px;align-content:start;overflow-y:scroll;}
.card-ready{background:linear-gradient(135deg,#20a040,#40c060);border-radius:20px;padding:22px 6px;text-align:center;font-size:clamp(32px,4.5vw,72px);font-weight:900;color:#fff;text-shadow:0 4px 12px rgba(0,0,0,.4);box-shadow:0 6px 18px rgba(64,192,96,.35);animation:pulse 1.4s ease-in-out infinite;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;line-height:1.05;display:flex;align-items:center;justify-content:center;min-height:90px;cursor:pointer;transition:transform .15s,box-shadow .15s;}
.card-ready:hover{transform:scale(1.04);box-shadow:0 10px 24px rgba(64,192,96,.6);}
@keyframes pulse{0%,100%{transform:scale(1);box-shadow:0 8px 24px rgba(64,192,96,.4);}50%{transform:scale(1.03);box-shadow:0 12px 36px rgba(64,192,96,.7);}}
.list-cooking{flex:1;display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px;align-content:start;overflow-y:scroll;}
.chip{background:rgba(127,200,255,.15);border:2px solid rgba(127,200,255,.4);border-radius:14px;padding:18px 6px;text-align:center;font-size:clamp(28px,4vw,42px);font-weight:800;color:#cfe6ff;overflow:hidden;word-break:break-all;line-height:1.1;}
.empty{color:#666;font-size:24px;text-align:center;padding:60px 0;grid-column:1/-1;}
footer{background:#000;padding:14px 40px;display:flex;justify-content:space-between;font-size:clamp(12px,1.5vw,20px);color:#888;border-top:1px solid #222;white-space:nowrap;gap:10px;overflow:hidden;}
footer .waiting{color:#ffb84d;font-weight:700;}
</style>
</head>
<body>
<header>
  <h1 id="sname">푸드트럭</h1>
  <div class="clock" id="clock">--:--</div>
</header>
<main>
  <section class="panel ready">
    <h2>📢 픽업하세요 <span class="count" id="cnt-ready">0</span></h2>
    <div class="grid-ready" id="list-ready"><div class="empty">호출 대기 중인 주문이 없습니다</div></div>
  </section>
  <section class="panel cooking">
    <h2>🍳 조리중 <span class="count" id="cnt-cooking">0</span></h2>
    <div class="list-cooking" id="list-cooking"><div class="empty">없음</div></div>
  </section>
</main>
<footer>
  <div>주문 후 픽업번호를 확인해 주세요</div>
  <div class="waiting">대기 <span id="cnt-waiting">0</span>팀</div>
</footer>
<script>
let lastReady=new Set();
let audioCtx=null;
function ding(){
  try{
    if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();
    const o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.connect(g);g.connect(audioCtx.destination);
    o.type='sine';o.frequency.value=880;g.gain.value=.3;
    o.start();
    setTimeout(()=>{o.frequency.value=1320;},150);
    setTimeout(()=>{o.frequency.value=1760;},300);
    setTimeout(()=>{o.stop();},700);
    if(window.speechSynthesis){
      // 호출 음성은 새 호출만 따로 처리
    }
  }catch(e){}
}
// 음성 프리셋 — 각 매장 취향대로
const VOICE_PRESETS = {
  basic:     { label:'🎤 기본',     text: n => n+'번 손님 픽업해주세요',                     rate:1.0,  pitch:1.0 },
  kind:      { label:'😊 친절',     text: n => n+'번 손님, 픽업 부탁드려요!',                rate:1.15, pitch:1.5 },
  bright:    { label:'✨ 청량',     text: n => n+'번 손님~ 픽업이요!',                       rate:1.2,  pitch:1.7 },
  excited:   { label:'🎉 신남',     text: n => '와! '+n+'번 손님 픽업이요~',                 rate:1.25, pitch:1.8 },
  calm:      { label:'🌙 차분',     text: n => n+'번 손님 픽업하세요',                       rate:0.95, pitch:0.95 },
  energetic: { label:'⚡ 활기',     text: n => n+'번 손님 픽업 도착이요!',                   rate:1.3,  pitch:1.4 },
  greeting:  { label:'👋 인사',     text: n => '안녕하세요! '+n+'번 손님 픽업이에요~',       rate:1.15, pitch:1.4 },
  sweet:     { label:'🍰 달콤',     text: n => n+'번 손님 픽업이요, 맛있게 드세요!',         rate:1.1,  pitch:1.6 },
  polite:    { label:'💝 깍듯',     text: n => n+'번 고객님, 음식 나왔습니다',                rate:1.0,  pitch:1.0 },
  clear:     { label:'🤖 또렷',     text: n => '픽업번호 '+n+'번 손님',                      rate:0.9,  pitch:1.0 },
  truck:     { label:'🍔 푸드트럭', text: n => n+'번이요! 픽업 부탁드립니다!',              rate:1.2,  pitch:1.3 },
  cute:      { label:'🐰 깜찍',     text: n => n+'번 손님 픽업이에요~',                      rate:1.15, pitch:1.9 },
  fast:      { label:'🏃 빠르게',   text: n => n+'번 픽업이요!',                             rate:1.4,  pitch:1.5 },
  song:      { label:'🎵 노래',     text: n => n+'번 손님~ 픽업이요~ 픽업 부탁드려요~',     rate:1.05, pitch:1.7 },
  warm:      { label:'☕ 따뜻',     text: n => n+'번 손님 픽업 도와드릴게요',                rate:0.95, pitch:1.2 },
  cheer:     { label:'🥳 응원',     text: n => '짜잔! '+n+'번 손님 픽업이에요!',             rate:1.2,  pitch:1.8 },
};
// POS에서 푸시한 프리셋 우선 사용, 없으면 'kind' 기본값
let _pushedVoicePreset = null;
function getCurrentVoicePreset(){
  return _pushedVoicePreset || 'kind';
}
function speak(pickup){
  try{
    if(!window.speechSynthesis)return;
    const num=pickup.replace(/^[A-Za-z]+/,'').replace(/^0+/,'')||pickup;
    const presetKey = getCurrentVoicePreset();
    const preset = VOICE_PRESETS[presetKey] || VOICE_PRESETS.kind;
    const u=new SpeechSynthesisUtterance(preset.text(num));
    u.lang='ko-KR';
    u.rate=preset.rate;
    u.pitch=preset.pitch;
    u.volume=1;
    const voices = speechSynthesis.getVoices();
    const koVoices = voices.filter(v => /ko/i.test(v.lang));
    const preferred = koVoices.find(v => /female|여성|Heami|SunHi|InJoon|Yuna/i.test(v.name + ' ' + (v.voiceURI||'')))
                   || koVoices[0];
    if(preferred) u.voice = preferred;
    speechSynthesis.speak(u);
  }catch(e){}
}
function changeVoicePreset(key){
  localStorage.setItem('displayVoicePreset', key);
  // 테스트 재생
  speak('A0005');
  // 셀렉트 UI 갱신
  const sel = document.getElementById('voice-preset-sel');
  if(sel) sel.value = key;
}
// 카드 클릭 → 다시 호출 (벨 + TTS + 카드 깜빡임) — 처음 호출과 동일한 타이밍
function recall(pickup){
  ding();
  setTimeout(()=>speak(pickup), 400);
  try{
    const cards = document.querySelectorAll('.card-ready');
    cards.forEach(c => {
      if(c.textContent.trim() === pickup){
        c.style.transform='scale(1.1)';
        c.style.boxShadow='0 12px 36px rgba(255,200,80,.9)';
        setTimeout(()=>{ c.style.transform=''; c.style.boxShadow=''; }, 600);
      }
    });
  }catch(e){}
}
function tickClock(){
  const d=new Date();
  document.getElementById('clock').textContent=
    String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+':'+String(d.getSeconds()).padStart(2,'0');
}
setInterval(tickClock,1000);tickClock();

// 헤더/제목 자동 축소 — 어떤 해상도/비율에서도 한 줄에 들어가도록
function fitOneLine(el, maxPx, minPx){
  if(!el) return;
  let size = maxPx;
  el.style.fontSize = size + 'px';
  let guard = 0;
  while(el.scrollWidth > el.clientWidth && size > minPx && guard < 60){
    size -= 1;
    el.style.fontSize = size + 'px';
    guard++;
  }
}
function fitAllHeadings(){
  document.querySelectorAll('header h1').forEach(el => fitOneLine(el, 42, 14));
  document.querySelectorAll('.panel h2').forEach(el => fitOneLine(el, 36, 14));
}
window.addEventListener('resize', fitAllHeadings);
setTimeout(fitAllHeadings, 50);


let firstLoad=true;
function render(d){
  if(d.sname)document.getElementById('sname').textContent=d.sname;
  const ready=d.ready||[];
  document.getElementById('cnt-ready').textContent=ready.length;
  const elR=document.getElementById('list-ready');
  if(ready.length){
    elR.innerHTML=ready.map(p=>`<div class="card-ready" onclick="recall('${p}')" title="클릭하면 다시 호출">${p}</div>`).join('');
  }else{
    elR.innerHTML='<div class="empty">호출 대기 중인 주문이 없습니다</div>';
  }
  if(!firstLoad){
    ready.forEach(p=>{
      if(!lastReady.has(p)){
        ding();
        setTimeout(()=>speak(p),400);
      }
    });
  }
  lastReady=new Set(ready);
  const cooking=d.cooking||[];
  document.getElementById('cnt-cooking').textContent=cooking.length;
  const elC=document.getElementById('list-cooking');
  elC.innerHTML=cooking.length?cooking.map(p=>`<div class="chip">${p}</div>`).join(''):'<div class="empty">없음</div>';
  document.getElementById('cnt-waiting').textContent=(d.waiting||[]).length+cooking.length;
  firstLoad=false;
}

// Firebase RTDB 실시간 구독 — Netlify 환경에서 동작
function startCloudSubscribe(){
  if(typeof FT==='undefined')return false;
  FT.menu().on('value',snap=>{
    const v=snap.val()||{};
    if(v.sname)document.getElementById('sname').textContent=v.sname;
    // POS에서 푸시한 음성 프리셋 적용
    if(v.event && v.event.displayVoicePreset && VOICE_PRESETS[v.event.displayVoicePreset]){
      _pushedVoicePreset = v.event.displayVoicePreset;
    }
  });
  FT.orders().on('value',snap=>{
    const v=snap.val()||{};
    const today=new Date().toDateString();
    const orders=Object.values(v).filter(o=>o&&o.createdAt&&new Date(o.createdAt).toDateString()===today);
    render({
      ok:true,
      sname:document.getElementById('sname').textContent,
      waiting:orders.filter(o=>o.status==='pending'||o.status==='paid').map(o=>o.pickup),
      cooking:orders.filter(o=>o.status==='cooking').map(o=>o.pickup),
      ready:orders.filter(o=>o.status==='ready').map(o=>o.pickup),
    });
  });
  return true;
}

// 로컬 모드 폴링 폴백 — Electron 내 로컬 HTTP 서버에서 띄울 때 사용
async function loadLocal(){
  try{
    const r=await fetch('/api/ft/display');
    if(!r.ok)return;
    const d=await r.json();
    if(!d.ok)return;
    render(d);
  }catch(e){}
}

if(typeof FT!=='undefined'){
  startCloudSubscribe();
}else{
  loadLocal();
  setInterval(loadLocal,2500);
}
// 첫 클릭으로 오디오 컨텍스트 활성화 (브라우저 정책)
document.addEventListener('click',()=>{if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();},{once:true});
</script>
</body>
</html>
